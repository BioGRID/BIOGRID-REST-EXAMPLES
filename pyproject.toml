[project]
name = "biogrid-rest-examples"
version = "2.0.0"
description = "Sample code for accessing the BioGRID REST service and working with the resulting datasets"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pandas>=3.1.1",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# The formatter handles code line length; comments and sample API output blocks are allowed to run long
ignore = ["E501"]
